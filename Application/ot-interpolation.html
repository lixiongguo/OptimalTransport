<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最优传输图像插值 — Optimal Transport Image Morphing</title>
<script src="assets/js/wasm-loader.js"></script>
<script src="assets/wasm/omt_solver.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background: #0a0f1a;
  color: #d0d8f0;
  min-height: 100vh;
  overflow-x: hidden;
}
.header {
  background: linear-gradient(135deg, #111b30, #1a2540);
  border-bottom: 2px solid rgba(120,150,255,0.2);
  padding: 22px 30px;
  text-align: center;
}
.header h1 { font-size: 28px; font-weight: 300; letter-spacing: 2px; color: #c8d8ff; }
.header h1 span { font-weight: 700; color: #ffaa44; }
.header .sub { margin-top: 6px; font-size: 13px; color: #6e84b8; letter-spacing: 1px; }
.header .nav-select { margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.header .nav-select label { font-size: 13px; color: #ffaa44; font-weight: 700; letter-spacing: 1px; }
.header .nav-select select { 
  padding: 8px 18px; 
  border: 2px solid rgba(255,170,68,0.5); 
  border-radius: 10px; 
  background: linear-gradient(135deg, #1a1a3a, #2a2040); 
  color: #ffcc66; 
  font-size: 15px; 
  font-weight: 600; 
  cursor: pointer;
  box-shadow: 0 0 12px rgba(255,170,68,0.2);
  transition: all .3s;
}
.header .nav-select select:hover { border-color: rgba(255,170,68,0.9); box-shadow: 0 0 20px rgba(255,170,68,0.35); }
.header .nav-select select:focus { outline: none; border-color: #ffaa44; box-shadow: 0 0 24px rgba(255,170,68,0.5); }
.header .nav-select a {
  padding: 8px 18px;
  border: 2px solid rgba(255,170,68,0.5);
  border-radius: 10px;
  background: linear-gradient(135deg, #1a1a3a, #2a2040);
  color: #ffcc66;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: 1px;
}
.header .nav-select a:hover { border-color: #ffaa44; color: #ffe0b2; }

.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 20px;
}

/* Controls */
.controls {
  background: #11192c;
  border-radius: 16px;
  padding: 20px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
}
.controls button {
  padding: 10px 24px;
  border: 1px solid rgba(120,150,255,0.3);
  border-radius: 10px;
  background: linear-gradient(135deg, #1e3358, #2a4578);
  color: #e0e8ff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .25s;
  letter-spacing: 1px;
}
.controls button:hover:not(:disabled) {
  background: linear-gradient(135deg, #2e4778, #3a5e9a);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(100,140,255,0.25);
}
.controls button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.controls button.compute {
  background: linear-gradient(135deg, #c06020, #e07830);
  border-color: rgba(255,160,60,0.4);
}
.controls select {
  padding: 9px 14px;
  border: 2px solid rgba(106,200,255,0.45);
  border-radius: 10px;
  background: linear-gradient(135deg, #132040, #1a3058);
  color: #e8f0ff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .3s;
  letter-spacing: 0.5px;
}
.controls select:hover { border-color: rgba(106,200,255,0.85); box-shadow: 0 0 12px rgba(106,180,255,0.3); }
.controls label {
  font-size: 13px;
  color: #8a9eca;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.pair-bar {
  background: #11192c;
  border: 1px solid rgba(255,170,68,0.35);
  border-radius: 16px;
  padding: 14px 20px;
  margin-bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: center;
}
.pair-bar label {
  font-size: 14px;
  color: #ffaa44;
  font-weight: 700;
  letter-spacing: 1px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.pair-bar select {
  padding: 9px 16px;
  border: 2px solid rgba(255,170,68,0.55);
  border-radius: 10px;
  background: linear-gradient(135deg, #1a1a3a, #2a2040);
  color: #ffcc66;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(255,170,68,0.2);
}
.pair-bar select:hover {
  border-color: rgba(255,170,68,0.9);
  box-shadow: 0 0 20px rgba(255,170,68,0.35);
}
.pair-bar .hint {
  font-size: 12px;
  color: #6e84b8;
}

/* Display area */
.display {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: center;
  margin-bottom: 24px;
}

/* Multi-solver comparison */
.compare-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
  margin-bottom: 26px;
  align-items: start;
}
.solver-card {
  background: #0e1526;
  border: 1px solid rgba(120,140,200,0.18);
  border-radius: 16px;
  padding: 14px 14px 12px;
  text-align: center;
}
.solver-card .name {
  font-size: 14px;
  font-weight: 700;
  color: #ffaa44;
  letter-spacing: 1px;
}
.solver-card .name .tag {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 8px;
  background: rgba(120,150,255,0.12);
  color: #8aa4d8;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0;
}
.solver-card canvas {
  width: 100%;
  height: auto;
  border-radius: 8px;
  image-rendering: pixelated;
  display: block;
  margin-top: 10px;
  background: #070b14;
}
.solver-card .meta {
  margin-top: 8px;
  font-size: 11px;
  color: #6e84b8;
  font-family: Consolas, monospace;
  letter-spacing: 0.5px;
}
.image-box {
  background: #0e1526;
  border-radius: 16px;
  padding: 12px;
  text-align: center;
  border: 1px solid rgba(120,140,200,0.15);
}
.image-box canvas {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  image-rendering: pixelated;
  display: block;
  margin: 0 auto;
}
.image-box .label {
  margin-top: 8px;
  font-size: 12px;
  color: #5a74a8;
  letter-spacing: 1px;
}

/* Slider */
.slider-section {
  background: #11192c;
  border-radius: 16px;
  padding: 20px 28px;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.slider-section input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(90deg, #1e3a6e, #4a78d4);
  outline: none;
}
.slider-section input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ffaa44;
  cursor: pointer;
  border: 3px solid #0a0f1a;
  box-shadow: 0 0 12px rgba(255,170,68,0.4);
}
.slider-section .t-val {
  min-width: 50px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: #ffaa44;
  font-family: Consolas, monospace;
}

/* Frames grid */
.frames-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #8aa4d8;
  margin-bottom: 14px;
}
.frames-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.frames-block .fb-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 8px;
}
.frames-block .fb-name {
  font-size: 13px;
  font-weight: 700;
  color: #ffaa44;
  letter-spacing: 1px;
}
.frames-block .fb-meta { font-size: 11px; color: #5a74a8; }
.frames-grid {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
}
.frame-item {
  flex-shrink: 0;
  background: #0e1526;
  border-radius: 12px;
  padding: 8px;
  text-align: center;
  border: 2px solid rgba(120,140,200,0.1);
  transition: border-color .2s;
}
.frame-item.active {
  border-color: #ffaa44;
  box-shadow: 0 0 14px rgba(255,170,68,0.2);
}
.frame-item canvas {
  border-radius: 6px;
  image-rendering: pixelated;
}
.frame-item .fn { font-size: 11px; color: #5a74a8; margin-top: 4px; }

/* Status */
.status-bar {
  margin-top: 18px;
  padding: 14px 20px;
  background: #0e1526;
  border-radius: 12px;
  font-size: 13px;
  text-align: center;
  color: #6e84b8;
}
.status-bar.success { color: #52d681; }
.status-bar.error { color: #ff6b6b; }
.status-bar.loading { color: #ffaa44; }

@media (max-width: 800px) {
  .display { grid-template-columns: 1fr; }
  .compare-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1>最优传输 <span>图像插值</span></h1>
  <div class="sub">Optimal Mass Transport &mdash; Monge-Kantorovich Image Morphing</div>
  <div class="nav-select">
    <label>实验：</label>
    <a href="/">&larr; 实验列表</a>
    <a href="semi-discrete-ot.html">半离散 OT &rarr;</a>
  </div>
</div>

<div class="main">
  <div class="pair-bar">
    <label>图像对
      <select id="pair-select">
        <option value="flame" selected>flame_1 → flame_2（176×176）</option>
        <option value="cloud">cloud_1 → cloud_2（486×324）</option>
        <option value="water">water_1 → water_2（256×256）</option>
      </select>
    </label>
    <span class="hint">切换后会重新加载源/目标图</span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="compute-btn" class="compute" disabled>⚡ 计算并对比全部算法</button>
    <label>帧数
      <select id="frames-select">
        <option value="6">6</option>
        <option value="8" selected>8</option>
        <option value="12">12</option>
        <option value="16">16</option>
      </select>
    </label>
    <label>AHT 块大小
      <select id="block-select">
        <option value="2">2</option>
        <option value="4" selected>4</option>
        <option value="8">8</option>
      </select>
    </label>
    <label>AHT 均衡化
      <select id="eq-select">
        <option value="0" selected>总质量比</option>
        <option value="1">直方图均衡</option>
      </select>
    </label>
    <label>Sinkhorn 正则 ε
      <select id="eps-select">
        <option value="10">0.010</option>
        <option value="20" selected>0.020</option>
        <option value="50">0.050</option>
      </select>
    </label>
  </div>

  <!-- Image Display -->
  <div class="display">
    <div class="image-box">
      <canvas id="canvas-img0"></canvas>
      <div class="label" id="label-src">SOURCE — flame_1</div>
    </div>
    <div class="image-box">
      <canvas id="canvas-img1"></canvas>
      <div class="label" id="label-tgt">TARGET — flame_2</div>
    </div>
  </div>

  <!-- 多算法并排对比 -->
  <div class="compare-grid" id="compare-grid"></div>

  <!-- Slider -->
  <div class="slider-section">
    <span style="font-size:13px;color:#8aa4d8;">t=0</span>
    <input type="range" id="t-slider" min="0" max="100" value="50" step="1">
    <span class="t-val" id="t-display">0.50</span>
    <span style="font-size:13px;color:#8aa4d8;">t=1</span>
  </div>

  <!-- All Frames -->
  <div class="frames-title" id="frames-label">插值序列对比（点击计算后生成）</div>
  <div class="frames-stack" id="frames-grid"></div>

  <!-- Status -->
  <div class="status-bar" id="status-bar">等待加载图像...</div>
</div>

<script>
(function() {
  // ============ State ============
  let omtInstance = null, omtReady = false, omtFailed = false;
  let image0Data = null, image1Data = null;  // { data: Uint8ClampedArray, w, h }
  let results = [];                           // 每个算法一份 { id, name, frames, w, h, timeMs, iterations }
  let currentT = 0.5;

  // 一次算完这几个算法，结果并排展示。
  const SOLVERS = [
    { id: 0, name: 'AHT（自研）', tag: '块网格 + 梯度流' },
    { id: 1, name: 'Sinkhorn', tag: '熵正则' },
    { id: 2, name: 'FFT', tag: '频域' }
  ];

  const canvasImg0 = document.getElementById('canvas-img0');
  const canvasImg1 = document.getElementById('canvas-img1');
  const statusBar = document.getElementById('status-bar');
  const computeBtn = document.getElementById('compute-btn');
  const tSlider = document.getElementById('t-slider');
  const tDisplay = document.getElementById('t-display');
  const compareGrid = document.getElementById('compare-grid');
  const framesGrid = document.getElementById('frames-grid');
  const framesLabel = document.getElementById('frames-label');

  function setStatus(msg, cls) {
    statusBar.textContent = msg;
    statusBar.className = 'status-bar ' + (cls || '');
  }

  // ============ WASM Init ============
  const WASM_BASE = (typeof WasmLoader !== 'undefined' && WasmLoader.BASE)
    ? WasmLoader.BASE
    : 'assets/wasm/';

  function loadScriptOnce(url) {
    return new Promise(function(resolve, reject) {
      const existing = document.querySelector('script[src="' + url + '"]');
      if (existing && typeof OmTSolver === 'function') { resolve(); return; }
      const s = document.createElement('script');
      s.src = url;
      s.onload = function() { resolve(); };
      s.onerror = function() { reject(new Error('Failed to load ' + url)); };
      document.head.appendChild(s);
    });
  }

  async function ensureOmTFactory() {
    if (typeof OmTSolver === 'function') return;
    const candidates = [
      WASM_BASE + 'omt_solver.js',
      './assets/wasm/omt_solver.js',
      '/assets/wasm/omt_solver.js'
    ];
    let lastErr = null;
    for (let i = 0; i < candidates.length; i++) {
      try {
        await loadScriptOnce(candidates[i]);
        if (typeof OmTSolver === 'function') return;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('omt_solver.js 未加载（请确认 assets/wasm/omt_solver.js 已部署）');
  }

  async function initOmT() {
    if (omtReady) return true;
    if (omtFailed) return false;
    try {
      setStatus('WASM 模块加载中...', 'loading');
      await ensureOmTFactory();
      // 显式 locateFile：避免 document.currentScript 为空时去根路径找 .wasm
      omtInstance = await OmTSolver({
        locateFile: function(path) {
          if (path.endsWith('.wasm') || path.endsWith('.js')) {
            return WASM_BASE + path.replace(/^.*\//, '');
          }
          return WASM_BASE + path;
        }
      });
      omtReady = true;
      setStatus('WASM 就绪，正在加载图像...', 'loading');
      return true;
    } catch (e) {
      omtFailed = true;
      const msg = (e && e.message) ? e.message : String(e);
      setStatus('WASM 加载失败: ' + msg + '（检查 ' + WASM_BASE + 'omt_solver.wasm）', 'error');
      console.error(e);
      return false;
    }
  }

  // ============ Image Loading ============
  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, img.width, img.height);
        resolve({ data: imageData.data, w: img.width, h: img.height });
      };
      img.onerror = function() { reject(new Error('图片加载失败: ' + url)); };
      img.src = url;
    });
  }

  function drawImageToCanvas(canvas, imageData) {
    if (!imageData) return;
    canvas.width = imageData.w;
    canvas.height = imageData.h;
    const ctx = canvas.getContext('2d');
    const imgData = new ImageData(imageData.data.slice(), imageData.w, imageData.h);
    ctx.putImageData(imgData, 0, 0);
  }

  function drawFrameToCanvas(canvas, frame, w, h) {
    if (!frame || !w || !h) {
      canvas.width = 1; canvas.height = 1;
      return;
    }
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.putImageData(new ImageData(frame.slice(), w, h), 0, 0);
  }

  // ============ Image pairs ============
  const IMAGE_PAIRS = {
    flame: { id: 'flame', src: 'flame_1.bmp', tgt: 'flame_2.bmp', labelSrc: 'flame_1', labelTgt: 'flame_2' },
    cloud: { id: 'cloud', src: 'cloud_1.bmp', tgt: 'cloud_2.bmp', labelSrc: 'cloud_1', labelTgt: 'cloud_2' },
    water: { id: 'water', src: 'water_1.jpg', tgt: 'water_2.jpg', labelSrc: 'water_1', labelTgt: 'water_2' }
  };

  async function loadImageWithFallback(fileName) {
    // 图片在 OptimalTransport/data/，页面在 Application/。
    const candidates = [
      '../data/' + fileName,
      'data/' + fileName,
      './data/' + fileName
    ];
    let lastErr = null;
    for (let i = 0; i < candidates.length; i++) {
      try {
        return await loadImage(candidates[i]);
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('无法加载 ' + fileName);
  }

  // ============ Load Images ============
  async function loadImages(pairKey) {
    const key = pairKey || document.getElementById('pair-select').value;
    const pair = IMAGE_PAIRS[key] || IMAGE_PAIRS.flame;

    computeBtn.disabled = true;
    results = [];
    framesGrid.innerHTML = '';
    framesLabel.textContent = '插值序列对比（点击计算后生成）';
    paintCompare();

    try {
      setStatus('加载 ' + pair.src + ' ...', 'loading');
      image0Data = await loadImageWithFallback(pair.src);

      setStatus('加载 ' + pair.tgt + ' ...', 'loading');
      image1Data = await loadImageWithFallback(pair.tgt);

      if (image0Data.w !== image1Data.w || image0Data.h !== image1Data.h) {
        throw new Error('图像尺寸不一致: ' + image0Data.w + 'x' + image0Data.h +
          ' vs ' + image1Data.w + 'x' + image1Data.h);
      }

      document.getElementById('label-src').textContent = 'SOURCE — ' + pair.labelSrc;
      document.getElementById('label-tgt').textContent = 'TARGET — ' + pair.labelTgt;

      drawImageToCanvas(canvasImg0, image0Data);
      drawImageToCanvas(canvasImg1, image1Data);

      computeBtn.disabled = false;
      setStatus('就绪 — ' + pair.labelSrc + ' → ' + pair.labelTgt + '（' +
        image0Data.w + '×' + image0Data.h + '），点击"计算并对比全部算法"', 'success');
    } catch (e) {
      setStatus('图像加载失败: ' + e.message, 'error');
      console.error(e);
    }
  }

  // ============ Compute all solvers ============
  async function computeAll() {
    if (!omtReady || !image0Data || !image1Data) return;

    const numFrames = parseInt(document.getElementById('frames-select').value);
    const squareEdgeLen = parseInt(document.getElementById('block-select').value);
    const eqMethod = parseInt(document.getElementById('eq-select').value);
    const epsilonMilli = parseInt(document.getElementById('eps-select').value);

    computeBtn.disabled = true;
    tSlider.disabled = true;
    results = [];
    paintCompare();
    framesGrid.innerHTML = '';
    framesLabel.textContent = '计算中...';

    const w = image0Data.w, h = image0Data.h;
    const channels = 4;
    const len = w * h * channels;

    const ptr0 = omtInstance._malloc(len);
    const ptr1 = omtInstance._malloc(len);
    omtInstance.HEAPU8.set(new Uint8Array(image0Data.data), ptr0);
    omtInstance.HEAPU8.set(new Uint8Array(image1Data.data), ptr1);

    const collected = [];
    try {
      for (let s = 0; s < SOLVERS.length; s++) {
        const solver = SOLVERS[s];
        setStatus('(' + (s + 1) + '/' + SOLVERS.length + ') ' + solver.name + ' 计算中...', 'loading');

        const ret = omtInstance.ccall('solve_omt_series', 'number',
          ['number', 'number', 'number', 'number',
           'number', 'number', 'number', 'number',
           'number', 'number', 'number', 'number',
           'number', 'number'],
          [ptr0, len, w, h,
           ptr1, len, w, h,
           channels, squareEdgeLen, numFrames, eqMethod,
           solver.id, epsilonMilli]
        );

        if (ret !== 0) {
          collected.push({ id: solver.id, name: solver.name, error: '计算失败（错误码 ' + ret + '）' });
          continue;
        }

        const outW = omtInstance.ccall('get_omt_frame_width', 'number', [], []);
        const outH = omtInstance.ccall('get_omt_frame_height', 'number', [], []);
        const outCount = omtInstance.ccall('get_omt_frame_count', 'number', [], []);
        const outPtr = omtInstance.ccall('get_omt_result_data', 'number', [], []);
        const timeMs = omtInstance.ccall('get_omt_last_time_ms', 'number', [], []);
        const iterations = omtInstance.ccall('get_omt_iterations', 'number', [], []);

        // 结果缓冲区是全局的，下一轮求解会覆盖，所以先整块拷出来。
        const frameSize = outW * outH * 4;
        const frames = [];
        for (let f = 0; f < outCount; f++) {
          const offset = outPtr + f * frameSize;
          frames.push(new Uint8ClampedArray(omtInstance.HEAPU8.subarray(offset, offset + frameSize)));
        }

        collected.push({
          id: solver.id, name: solver.name, frames: frames,
          w: outW, h: outH, timeMs: timeMs, iterations: iterations
        });

        omtInstance.ccall('omt_dispose', 'void', [], []);
      }
    } catch (e) {
      setStatus('计算失败: ' + e.message, 'error');
      console.error(e);
      omtInstance.ccall('omt_dispose', 'void', [], []);
    } finally {
      omtInstance._free(ptr0);
      omtInstance._free(ptr1);
      computeBtn.disabled = false;
      tSlider.disabled = false;
    }

    results = collected;
    paintCompare();
    renderFrames();

    const ok = results.filter(function(r) { return !r.error; });
    if (ok.length === 0) {
      setStatus('全部算法均失败', 'error');
      return;
    }
    tSlider.value = Math.floor((ok[0].frames.length / 2)) * (100 / ok[0].frames.length);
    updateSlider();

    framesLabel.textContent = '插值序列对比（每个算法 ' + ok[0].frames.length + ' 帧）';
    setStatus('计算完成 — ' + ok.map(function(r) {
      return r.name + ' ' + r.timeMs.toFixed(0) + ' ms';
    }).join('　|　'), 'success');
  }

  // ============ Comparison cards ============
  function buildCompareCards() {
    compareGrid.innerHTML = '';
    SOLVERS.forEach(function(sv) {
      const card = document.createElement('div');
      card.className = 'solver-card';

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = sv.name;
      if (sv.tag) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = sv.tag;
        name.appendChild(tag);
      }

      const canvas = document.createElement('canvas');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = '未计算';

      card.appendChild(name);
      card.appendChild(canvas);
      card.appendChild(meta);
      compareGrid.appendChild(card);

      sv.card = card;
      sv.canvas = canvas;
      sv.meta = meta;
    });
  }

  function resultOf(solverId) {
    for (let i = 0; i < results.length; i++) {
      if (results[i].id === solverId) return results[i];
    }
    return null;
  }

  function frameIndex(count, t) {
    if (!count) return 0;
    return Math.min(Math.floor(t * count), count - 1);
  }

  function paintCompare() {
    SOLVERS.forEach(function(sv) {
      const r = resultOf(sv.id);
      if (!r || r.error) {
        sv.canvas.width = 1;
        sv.canvas.height = 1;
        sv.meta.textContent = r ? r.error : '未计算';
        return;
      }
      const idx = frameIndex(r.frames.length, currentT);
      drawFrameToCanvas(sv.canvas, r.frames[idx], r.w, r.h);
      const iterText = r.iterations > 0 ? ' · 迭代 ' + r.iterations : '';
      sv.meta.textContent = 't=' + currentT.toFixed(2) + ' · ' + r.w + '×' + r.h +
        ' · ' + r.timeMs.toFixed(0) + ' ms' + iterText;
    });
  }

  // ============ Slider ============
  function updateSlider() {
    const val = parseInt(tSlider.value) / 100;
    currentT = val;
    tDisplay.textContent = val.toFixed(2);

    paintCompare();

    document.querySelectorAll('.frame-item').forEach(function(el) {
      const r = resultOf(parseInt(el.dataset.solver));
      if (!r || r.error) return;
      el.classList.toggle('active', parseInt(el.dataset.idx) === frameIndex(r.frames.length, val));
    });
  }

  // ============ Frames Grid ============
  function renderFrameRow(solver, result) {
    const block = document.createElement('div');
    block.className = 'frames-block';

    const head = document.createElement('div');
    head.className = 'fb-head';
    const name = document.createElement('span');
    name.className = 'fb-name';
    name.textContent = solver.name;
    const meta = document.createElement('span');
    meta.className = 'fb-meta';
    meta.textContent = result.frames.length + ' 帧 · ' + result.w + '×' + result.h +
      ' · ' + result.timeMs.toFixed(0) + ' ms';
    head.appendChild(name);
    head.appendChild(meta);

    const row = document.createElement('div');
    row.className = 'frames-grid';

    const maxH = 80;
    const scale = maxH / Math.max(result.h, 1);
    const thumbW = Math.max(1, Math.round(result.w * scale));
    const thumbH = maxH;

    for (let i = 0; i < result.frames.length; i++) {
      const div = document.createElement('div');
      div.className = 'frame-item';
      div.dataset.idx = i;
      div.dataset.solver = solver.id;

      const canvas = document.createElement('canvas');
      canvas.width = thumbW;
      canvas.height = thumbH;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = result.w;
      offCanvas.height = result.h;
      offCanvas.getContext('2d').putImageData(
        new ImageData(result.frames[i].slice(), result.w, result.h), 0, 0);
      canvas.getContext('2d').drawImage(offCanvas, 0, 0, thumbW, thumbH);

      const fn = document.createElement('div');
      fn.className = 'fn';
      fn.textContent = '#' + (i + 1);

      div.appendChild(canvas);
      div.appendChild(fn);
      div.addEventListener('click', function() {
        tSlider.value = result.frames.length > 1
          ? Math.round(i / (result.frames.length - 1) * 100) : 50;
        updateSlider();
      });

      row.appendChild(div);
    }

    block.appendChild(head);
    block.appendChild(row);
    framesGrid.appendChild(block);
  }

  function renderFrames() {
    framesGrid.innerHTML = '';
    const ok = results.filter(function(r) { return !r.error; });
    if (ok.length === 0) return;
    SOLVERS.forEach(function(sv) {
      const r = resultOf(sv.id);
      if (r && !r.error) renderFrameRow(sv, r);
    });
  }

  // ============ Init ============
  tSlider.addEventListener('input', updateSlider);

  buildCompareCards();
  computeBtn.addEventListener('click', computeAll);

  document.getElementById('pair-select').addEventListener('change', function() {
    if (!omtReady) return;
    loadImages(this.value);
  });

  // Start: init WASM then load images
  (async function start() {
    setStatus('加载 WASM 模块...', 'loading');
    const wasmOk = await initOmT();
    if (wasmOk) {
      await loadImages();
    }
  })();
})();
</script>
</body>
</html>
